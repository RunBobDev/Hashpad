# Hashpad's build and check targets (SPEC 9).
#
# Run `task` with no arguments to list them.
#
# Requires go-task, which is a single binary and not a dependency of the
# application itself:
#
#     go install github.com/go-task/task/v3/cmd/task@latest
#
# https://taskfile.dev

version: '3'

vars:
  # The one string separating the portable artifact from the installed one. A
  # typo here does not fail the build -- the linker ignores a symbol path it
  # cannot resolve and says nothing, producing an executable that is simply not
  # portable. That is why `build:portable` runs a test before it builds.
  PORTABLE_LDFLAGS: '-X hashpad/internal/app.portableBuild=true'

  # NSIS installs here and does **not** add itself to PATH, so `wails build
  # -nsis` fails with a "makensis not found" that reads like a missing install.
  # Prepended for the installer target only, rather than changing the machine.
  NSIS_DIR: 'C:\Program Files (x86)\NSIS'

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  dev:
    desc: Run with hot reload. Long-running -- Ctrl+C to stop it
    cmds:
      - wails dev

  build:
    desc: Build Hashpad.exe into build/bin
    cmds:
      - wails build

  build:portable:
    desc: Build the portable Hashpad.exe into build/bin/portable
    cmds:
      - task: verify:portable-marker
      - wails build -ldflags "{{.PORTABLE_LDFLAGS}}" -o portable/Hashpad.exe

  verify:portable-marker:
    desc: Check that the portable build's -ldflags actually reach the marker
    # **Task-level, and that is not a style choice.** go-task silently ignores
    # `env:` on an individual command -- measured: a variable set there arrives
    # empty. This guard was written that way first, which left
    # HASHPAD_EXPECT_PORTABLE unset, which made the test *skip*, and a skipped
    # test passes. The guard against a silent failure was failing silently.
    # Caught by deliberately misspelling the symbol path and finding that
    # `task build:portable` still exited 0.
    env:
      HASHPAD_EXPECT_PORTABLE: 'true'
    cmds:
      # `-X` against a symbol path that does not exist is not an error: the
      # linker ignores it, the build succeeds, and the artifact is quietly not
      # portable. This test compiles with the flags the artifact ships with and
      # fails loudly when they do not land.
      - go test -ldflags "{{.PORTABLE_LDFLAGS}}" -run TestPortableMarkerMatchesTheBuild ./internal/app/

  build:installer:
    desc: Build the NSIS installer into build/bin
    platforms: [windows]
    cmds:
      # `silent` because the command line is the whole of PATH, which is noise
      # in a log and carries the machine's user name through it.
      - cmd: PATH="{{.NSIS_DIR}};{{.PATH}}" wails build -nsis
        silent: true

  build:all:
    desc: Build every artifact - installed, portable, and the installer
    cmds:
      - task: build
      - task: build:portable
      - task: build:installer

  test:
    desc: Run both test suites
    cmds:
      - task: test:go
      - task: test:frontend

  test:go:
    desc: Run the Go tests
    cmds:
      - go test ./...

  test:frontend:
    desc: Run the frontend tests
    dir: frontend
    cmds:
      - npm test

  lint:
    desc: Format, vet and lint both halves
    cmds:
      - task: lint:go
      - task: lint:frontend

  lint:go:
    desc: gofmt and go vet
    cmds:
      # Listed first so a human can see *which* files are unformatted, then
      # asserted, because `gofmt -l` prints the offenders and still exits 0.
      # Without the second line this target would report success on a
      # misformatted tree.
      - gofmt -l internal main.go
      - cmd: test -z "$(gofmt -l internal main.go)"
      - go vet ./...

  lint:frontend:
    desc: tsc, eslint and prettier
    dir: frontend
    cmds:
      - npx tsc --noEmit
      - npm run lint

  measure:
    desc: Measure the binary size, cold start and memory against SPEC 1.3's budgets
    platforms: [windows]
    cmds:
      # `powershell.exe`, not `pwsh`: the script uses CIM queries that behave
      # differently under PowerShell 7 here. It force-kills any running Hashpad
      # before each sample, which is what makes the numbers comparable.
      - powershell.exe -ExecutionPolicy Bypass -File scripts/measure.ps1
